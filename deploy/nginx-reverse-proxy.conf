# Example reverse-proxy vhost for exposing gw2-ops-board publicly through nginx.
# Replace <YOUR_DOMAIN> and <APP_HOST_IP> with your actual values.
# <APP_HOST_IP> is the discord-1min-proxy LXC's IP - this app runs there as one more
# docker-compose service, not on a dedicated LXC.
#
# This is the pre-certbot version (HTTP only, port 80). Running `certbot --nginx -d <YOUR_DOMAIN>`
# against it will rewrite this file in place to add the 443/TLS server block and an http->https
# redirect.

server {
    listen 80;
    listen [::]:80;
    server_name <YOUR_DOMAIN>;

    location / {
        proxy_pass http://<APP_HOST_IP>:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
